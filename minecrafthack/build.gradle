plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
}

version = '0.1.13'
group = 'dev.lobster'

repositories {
    mavenCentral()
}

dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.162.0+26.3'
    productionRuntimeMods 'net.fabricmc.fabric-api:fabric-api:0.162.0+26.3'
    testImplementation platform('org.junit:junit-bom:5.14.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

test {
    useJUnitPlatform()
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'lobster_client_test'
        enableGameTests = false
        enableClientGameTests = true
    }
}

tasks.register('clientTestJar', Jar) {
    archiveClassifier = 'gametest'
    from sourceSets.gametest.output
}

tasks.register('runPackagedClientTest', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    mods.from(tasks.named('clientTestJar'))
    jvmArgs.add('-Dfabric.client.gametest')
    runDir = layout.buildDirectory.dir('run/packagedClientTest')
}

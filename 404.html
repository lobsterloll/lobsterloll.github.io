<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LobsterLoll's Loboratory</title>
  <link rel="stylesheet" href="/style.css">
  <script>
    // GitHub Pages serves this file when a saved random address is opened.
    if (/^\/[a-z]{20,64}\/?$/.test(window.location.pathname)) {
      window.location.replace('/' + window.location.search + window.location.hash);
    }
  </script>
</head>
<body>
  <main class="shell">
    <h1>Let's head back to the Loboratory.</h1>
    <p><a href="/">Open the homepage</a></p>
  </main>
</body>
</html>
